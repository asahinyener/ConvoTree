[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "convotree"
version = "0.1.0"
description = "Interactive terminal chat interface with persistent knowledge graph and semantic testing capabilities"
readme = "CLI_README.md"
requires-python = ">=3.8"
dependencies = [
    "flask>=2.0.0",
    "openai>=1.0.0",
    "networkx>=2.8.0",
    "matplotlib>=3.5.0",
    "python-dotenv>=0.19.0",
    "rich>=12.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
convotree = "chat_cli:main"
convotree-start = "start_chat:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.hatch.build.targets.wheel]
packages = ["."]